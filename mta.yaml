_schema-version: 3.3.0
ID: FioriElementsRepo
description: A simple CAP project.
version: 1.0.0
modules:
  - name: FioriElementsRepo-srv
    type: nodejs
    path: gen/srv
    requires:
      - name: FioriElementsRepo-db
      - name: uaa_FioriElementsRepo
      - name: FioriElementsRepo-destination-service
      - name: FioriElementsRepo-connectivity
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    parameters:
      buildpack: nodejs_buildpack
      instances: 1
    build-parameters:
      builder: npm-ci
  - name: FioriElementsRepo-db-deployer
    type: hdb
    path: gen/db
    requires:
      - name: FioriElementsRepo-db
    parameters:
      buildpack: nodejs_buildpack
  - name: FioriElementsRepo-destination-content
    type: com.sap.application.content
    requires:
      - name: FioriElementsRepo-destination-service
        parameters:
          content-target: true
      - name: FioriElementsRepo_html_repo_host
        parameters:
          service-key:
            name: FioriElementsRepo_html_repo_host-key
      - name: uaa_FioriElementsRepo
        parameters:
          service-key:
            name: uaa_FioriElementsRepo-key
    parameters:
      content:
        instance:
          destinations:
            - Name: zbsepms_FioriElementsRepo_html_repo_host
              ServiceInstanceName: FioriElementsRepo-html5-app-host-service
              ServiceKeyName: FioriElementsRepo_html_repo_host-key
              sap.cloud.service: zbsepms
            - Authentication: OAuth2UserTokenExchange
              Name: zbsepms_uaa_FioriElementsRepo
              ServiceInstanceName: uaa_FioriElementsRepo
              ServiceKeyName: uaa_FioriElementsRepo-key
              sap.cloud.service: zbsepms
          existing_destinations_policy: ignore
    build-parameters:
      no-source: true
resources:
  - name: FioriElementsRepo-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: FioriElementsRepo-destination-service
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        HTML5Runtime_enabled: true
        version: 1.0.0
      service: destination
      service-name: FioriElementsRepo-destination-service
      service-plan: lite
  - name: FioriElementsRepo_html_repo_host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-name: FioriElementsRepo-html5-app-host-service
      service-plan: app-host
  - name: uaa_FioriElementsRepo
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        tenant-mode: dedicated
        xsappname: epms-${org}-${space}
      path: ./xs-security.json
      service: xsuaa

      service-plan: application
  - name: FioriElementsRepo-connectivity
    type: org.cloudfoundry.managed-service
    parameters:
      service: connectivity
      service-plan: lite
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
